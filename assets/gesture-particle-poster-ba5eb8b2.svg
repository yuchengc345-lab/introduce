<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Gesture Particle Field preview</title>
  <desc id="desc">A dark interactive particle field with glowing hand-tracking controls.</desc>
  <defs>
